<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hume Doors & Timber - Delivery Confirmation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.58),
          rgba(0, 0, 0, 0.58)
        ),
        url("doors-bg.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;

      background: rgba(255, 255, 255, 0.97);

      border-radius: 16px;
      padding: 34px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.28);

      text-align: center;
    }

    .logo {
      max-width: 190px;
      max-height: 75px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 27px;
      color: #222;
    }

    .subtitle {
      margin: 0 0 28px 0;
      color: #666;
      font-size: 15px;
    }

    .order-box {
      background: #f4f4f4;
      border-radius: 9px;

      padding: 14px 18px;
      margin-bottom: 26px;

      font-size: 17px;
    }

    .order-number {
      font-weight: bold;
      font-size: 19px;
    }

    .question {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .response-options {
      display: flex;
      gap: 14px;

      margin-bottom: 28px;
    }

    .response-options label {
      flex: 1;
      cursor: pointer;
    }

    .response-options input {
      display: none;
    }

    .option-button {
      display: block;

      padding: 15px;
      border-radius: 9px;

      border: 2px solid #ccc;

      font-size: 17px;
      font-weight: bold;

      transition: 0.2s;
    }

    .response-options input:checked + .option-button {
      border-color: #222;
      background: #222;
      color: white;
    }

    .message-label {
      display: block;
      text-align: left;

      font-weight: bold;
      margin-bottom: 8px;

      color: #333;
    }

    textarea {
      width: 100%;
      min-height: 105px;

      padding: 12px;

      border: 1px solid #ccc;
      border-radius: 8px;

      resize: vertical;
      font-family: inherit;
      font-size: 15px;

      margin-bottom: 22px;
    }

    textarea:focus {
      outline: none;
      border-color: #555;
    }

    .submit-button {
      width: 100%;

      border: none;
      border-radius: 9px;

      padding: 15px;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      background: #222;
      color: white;

      transition: 0.2s;
    }

    .submit-button:hover {
      background: #444;
    }

    .footer {
      margin-top: 22px;

      font-size: 12px;
      color: #888;
    }

    .error {
      display: none;

      background: #fff1f1;
      color: #a40000;

      border-radius: 8px;
      padding: 12px;

      margin-bottom: 20px;

      font-size: 14px;
    }

    @media (max-width: 520px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 26px 20px;
      }

      .logo {
        max-width: 160px;
      }

      h1 {
        font-size: 23px;
      }

      .response-options {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      src="logo.png"
      alt="Hume Doors & Timber"
      class="logo"
    >

    <h1>Delivery Confirmation</h1>

    <p class="subtitle">
      Please confirm whether you are able to accept your scheduled delivery.
    </p>

    <div id="errorMessage" class="error">
      The order number is missing from this link.
      Please contact Hume Doors & Timber.
    </div>

    <div class="order-box">
      Order Number:
      <span id="orderDisplay" class="order-number"></span>
    </div>

    <form
      id="deliveryForm"
      method="POST"
      action="https://webhooks.workato.com/webhooks/rest/300da1f2-64e4-4e2f-a651-875b583095d9/testtwilioresponse"
    >

      <input
        type="hidden"
        name="OrderNumber"
        id="OrderNumber"
      >

      <div class="question">
        Can you accept this delivery?
      </div>

      <div class="response-options">

        <label>
          <input
            type="radio"
            name="Response"
            value="Yes"
            required
          >

          <span class="option-button">
            Yes
          </span>
        </label>

        <label>
          <input
            type="radio"
            name="Response"
            value="No"
            required
          >

          <span class="option-button">
            No
          </span>
        </label>

      </div>

      <label
        for="Message"
        class="message-label"
      >
        Additional message
      </label>

      <textarea
        id="Message"
        name="Message"
        placeholder="Optional - please provide any delivery instructions or other information."
      ></textarea>

      <button
        type="submit"
        class="submit-button"
      >
        Submit Response
      </button>

    </form>

    <div class="footer">
      Hume Doors & Timber
    </div>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);
    const order = params.get("order");

    const orderDisplay =
      document.getElementById("orderDisplay");

    const orderInput =
      document.getElementById("OrderNumber");

    const form =
      document.getElementById("deliveryForm");

    const errorMessage =
      document.getElementById("errorMessage");

    if (order && order.trim() !== "") {

      orderDisplay.textContent = order;
      orderInput.value = order;

    } else {

      orderDisplay.textContent = "Not provided";

      errorMessage.style.display = "block";

      form.style.display = "none";
    }

  </script>

</body>
</html>
